<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해정펫 정리</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f6f4ef;--panel:#ffffff;--panel2:#faf8f3;--ink:#211e18;--mute:#6f685b;--line:#e7e1d3;
  --mana:#2563c9;--manabg:#e8f0fc;--warn:#b4421a;--warnbg:#fdeee6;--ok:#2f7a4a;--okbg:#e7f4ec;
  --t1:#8a8578;--t2:#3f8a5a;--t3:#2f6fb5;--t4:#8a4fc4;--t5:#c27a0a;
  --radius:16px;--radius-sm:11px;--shadow:0 1px 3px rgba(30,25,10,.06),0 1px 1px rgba(30,25,10,.05);
  --sticky:calc(env(safe-area-inset-top,0px) + 61px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151a;--panel:#1c1f26;--panel2:#20232b;--ink:#eee9db;--mute:#a39c8c;--line:#2d313b;
  --mana:#8ab4ff;--manabg:#202a40;--warn:#f3ac87;--warnbg:#3a2620;--ok:#8ad9a6;--okbg:#1d3326;
  --t1:#a39c8c;--t2:#7fd29a;--t3:#8ab4ff;--t4:#c6a0f5;--t5:#f2bb5c;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.3)
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13151a;--panel:#1c1f26;--panel2:#20232b;--ink:#eee9db;--mute:#a39c8c;--line:#2d313b;
  --mana:#8ab4ff;--manabg:#202a40;--warn:#f3ac87;--warnbg:#3a2620;--ok:#8ad9a6;--okbg:#1d3326;
  --t1:#a39c8c;--t2:#7fd29a;--t3:#8ab4ff;--t4:#c6a0f5;--t5:#f2bb5c;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.3)
}
:root[data-theme="light"]{color-scheme:light}
html{scroll-padding-top:calc(var(--sticky) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--mana);outline-offset:2px}

/* ── 레이아웃: 모바일 기본 ── */
.app{display:block}
.side{display:none}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
.topbar .ttl{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-height:44px;min-width:44px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 72px}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.drawer[hidden]{display:none}
.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet .hd b{font-size:18px}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.navbtn{display:flex;align-items:center;gap:8px;text-align:left;width:100%;min-height:50px;padding:10px 14px;border-radius:13px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:15px;font-weight:700;cursor:pointer}
.navbtn[aria-selected=true]{background:var(--mana);border-color:var(--mana);color:#fff}
h1{font-size:23px;margin:2px 0 2px;letter-spacing:-.02em;font-weight:800}
h2{font-size:20px;margin:6px 0 12px;letter-spacing:-.01em;font-weight:800}
h3{font-size:16.5px;margin:26px 0 9px;font-weight:800;padding-left:10px;border-left:4px solid var(--mana)}
p{margin:8px 0}
.sub{color:var(--mute);margin:2px 0 14px;font-size:14.5px}
.panel[hidden]{display:none}

/* ── 레이아웃: PC ── */
@media (min-width:900px){
  :root{--sticky:0px}
  .app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto;padding:24px 14px;border-right:1px solid var(--line);background:var(--panel)}
  .side .brand{font-size:19px;font-weight:800;padding:0 8px 4px}
  .side .brandsub{font-size:12.5px;color:var(--mute);padding:0 8px 14px}
  .side .navbtn{box-shadow:none;border-color:transparent;background:transparent;min-height:44px}
  .side .navbtn:hover{background:var(--panel2)}
  .side .navbtn[aria-selected=true]{background:var(--mana);color:#fff}
  .side .sidefoot{margin-top:auto;padding-top:14px}
  .side .sidefoot .iconbtn{width:100%}
  .topbar,.drawer{display:none!important}
  .wrap{max-width:1000px;padding:34px 40px 90px;font-size:16.5px}
  h1{font-size:28px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  table{font-size:14.5px}
}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.rule{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius-sm);padding:12px 13px}
.rule b{display:block;font-size:19px;color:var(--mana);font-weight:800}
.rule span{font-size:12.5px;color:var(--mute);line-height:1.4;display:block;margin-top:2px}
.note{border:1px solid var(--line);border-left:5px solid var(--mana);background:var(--panel);box-shadow:var(--shadow);border-radius:var(--radius-sm);padding:13px 15px;margin:12px 0;font-size:15px;line-height:1.7}
.note.warn{border-left-color:var(--warn);background:var(--warnbg)}
.note.ok{border-left-color:var(--ok);background:var(--okbg)}
.note b.t{display:block;margin-bottom:4px;font-size:15px}
.flow{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch;margin:12px 0;padding:0;list-style:none;counter-reset:s}
.flow li{counter-increment:s;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius-sm);padding:8px 12px;font-size:14.5px}
.flow li::before{content:counter(s) ". ";color:var(--mana);font-weight:800}
.tscroll{overflow-x:auto;margin:10px 0;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius-sm);background:var(--panel);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--mute);font-weight:700;white-space:nowrap;background:var(--panel2)}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:var(--panel2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
code{background:var(--manabg);color:var(--mana);padding:2px 7px;border-radius:6px;font-size:.92em}
details{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius-sm);margin:9px 0;padding:0 14px}
summary{cursor:pointer;padding:12px 0;font-weight:700;min-height:46px;display:flex;align-items:center}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details .body{padding-bottom:12px;font-size:15px;line-height:1.7}
.bars{margin:12px 0;display:grid;gap:9px}
.bar{display:grid;grid-template-columns:52px 1fr 86px;gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;background:var(--tc,var(--mana));min-width:3px;border-radius:7px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
.tools{position:sticky;top:var(--sticky);z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=number],select{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;min-width:0;min-height:46px}
input[type=search]{flex:1 1 200px}
input[type=number]{width:100%}
.chips{margin-top:9px;display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--mute);font-size:13.5px;margin:0 0 10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:11px}
.sk{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--tc);box-shadow:var(--shadow);border-radius:var(--radius-sm);padding:13px 14px;display:flex;flex-direction:column;gap:7px}
.sk .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sk .em{font-size:24px;line-height:1}
.sk .nm{font-weight:800;flex:1;min-width:0;font-size:16px}
.sk .st{color:var(--tc);font-size:12px;letter-spacing:1px;font-weight:700}
.mana{background:var(--manabg);color:var(--mana);font-weight:800;border-radius:7px;padding:3px 9px;font-size:13px;white-space:nowrap}
.meta{font-size:13px;color:var(--mute);display:flex;gap:4px 10px;flex-wrap:wrap}
.fl{font-size:14px;color:var(--mute);font-style:italic;line-height:1.55}
.fx{margin:0;padding-left:18px;font-size:14.5px;line-height:1.6}
.fx li{margin:3px 0}
.uq{font-size:11px;font-weight:800;color:var(--t4);border:1px solid var(--t4);border-radius:6px;padding:1px 6px;white-space:nowrap}
.empty{color:var(--mute);padding:34px 0;text-align:center;font-size:15px}
.loc{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius-sm);margin:9px 0;padding:0 14px}
.loc summary .sm{color:var(--mute);font-weight:400;font-size:13px;margin-left:6px}
.calc{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:15px;margin:12px 0}
.calc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.calc label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px;min-height:44px}
.calc label.ck input{width:20px;height:20px}
.calc .out{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.calc .big{background:var(--manabg);border-radius:var(--radius-sm);padding:10px 15px;flex:1 1 130px}
.calc .big b{display:block;font-size:22px;color:var(--mana);font-variant-numeric:tabular-nums;font-weight:800}
.calc .big span{font-size:12.5px;color:var(--mute)}
.foot{margin-top:38px;color:var(--mute);font-size:12.5px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}

/* 링크처럼 눌리는 글자 */
.lnk{all:unset;cursor:pointer;color:var(--mana);font-weight:700;border-bottom:1.5px dotted var(--mana);padding:1px 1px;border-radius:3px}
.lnk:hover{background:var(--manabg)}
.lnk:focus-visible{outline:2px solid var(--mana);outline-offset:2px}

/* 업데이트 내역 */
.upd{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:14px 16px;margin:12px 0}
.upd.latest{border-color:var(--ok)}
.upd .dt{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:8px}
.badge-new{background:var(--ok);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px}
.ui{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.6}
.ui:first-of-type{border-top:0}
.tag{flex:0 0 auto;min-width:46px;text-align:center;font-size:11.5px;font-weight:800;border-radius:7px;padding:2px 7px;margin-top:2px;background:var(--manabg);color:var(--mana)}
.tag.new{background:var(--okbg);color:var(--ok)}
.tag.fix{background:var(--warnbg);color:var(--warn)}
.ui .tx{flex:1;min-width:0}
.upd summary{cursor:pointer;list-style:none;margin-bottom:6px}
.upd summary::-webkit-details-marker{display:none}
.upd summary .dt{margin-bottom:2px}
.upd summary .dt::after{content:'▼';margin-left:auto;color:var(--mute);font-size:12px}
.upd:not([open]) summary .dt::after{content:'▶'}
.upd .utitle{font-size:17px;font-weight:800;line-height:1.45;margin:2px 0 4px}
.upd .fx{margin:0;padding-left:18px}
.upd .fx li{margin:5px 0}
.upd .ui{padding:11px 0}
.upd .tag{min-width:56px}

/* ── 모바일 가독성: 표를 카드형으로 ── */
@media (max-width:700px){
  body{font-size:16.5px}
  .tscroll:not(.keep){border:0;background:transparent;box-shadow:none;overflow:visible}
  .tscroll:not(.keep) table,.tscroll:not(.keep) tbody,.tscroll:not(.keep) tr,.tscroll:not(.keep) td{display:block;width:100%}
  .tscroll:not(.keep) thead{display:none}
  .tscroll:not(.keep) tr{background:var(--panel)!important;border:1px solid var(--line);border-radius:13px;padding:6px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
  .tscroll:not(.keep) td{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border:0;border-bottom:1px dashed var(--line);padding:8px 0;font-size:15px;white-space:normal;text-align:right}
  .tscroll:not(.keep) td:last-child{border-bottom:0}
  .tscroll:not(.keep) td::before{content:attr(data-label);flex:0 0 36%;max-width:36%;text-align:left;color:var(--mute);font-size:12.5px;font-weight:700;padding-top:2px}
  .tscroll:not(.keep) td .cv{flex:1;min-width:0;text-align:right;overflow-wrap:anywhere}
  .tscroll:not(.keep) td:first-child{display:block;text-align:left;font-weight:800;font-size:16px;color:var(--mana)}
  .tscroll:not(.keep) td:first-child::before{display:none}
  .tscroll:not(.keep) td:first-child .cv{text-align:left}
  .cards{grid-template-columns:repeat(2,1fr)}
  .list{grid-template-columns:1fr}
  .bar{grid-template-columns:44px 1fr 70px}
  .calc .grid{grid-template-columns:repeat(2,1fr)}
  .tools .row select{flex:1 1 100%}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;flex:0 0 auto}
}
@media (prefers-reduced-motion:no-preference){.chip,.navbtn,.iconbtn{transition:background .15s,color .15s,border-color .15s}}

/* 글줄바꿈: 한 글자씩 세로로 꺾이지 않게 */
body{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
td,th,.note,.ui .tx,.fx li,.sk,.rule,summary,.body,.sub,p{word-break:keep-all;overflow-wrap:break-word}
th,td{min-width:88px}
.tscroll table{min-width:620px}
.tscroll.keep td,.tscroll.keep th{min-width:0}
.tscroll.keep table{min-width:640px}
td.n,th.n{min-width:0}
.sk .nm{flex:1 1 130px}
.sk .top{row-gap:4px}
.sidehead{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px 0 8px}
.sidehead .brand{padding:0;display:flex;gap:6px;white-space:nowrap}
.sidehead .iconbtn{min-width:40px;min-height:40px;padding:0 10px}
.navbtn .ic{flex:0 0 auto}
.navbtn .lb{min-width:0}
.themebtn{display:inline-flex;align-items:center;justify-content:center;gap:4px}
@media (min-width:900px){
  .app{transition:grid-template-columns .2s}
  .app.collapsed{grid-template-columns:76px minmax(0,1fr)}
  .app.collapsed .lb,.app.collapsed .brandsub{display:none}
  .app.collapsed .side{padding:20px 8px;align-items:center}
  .app.collapsed .sidehead{flex-direction:column;padding:0}
  .app.collapsed .navbtn{justify-content:center;padding:10px 0}
  .app.collapsed .navbtn .ic{font-size:21px}
  .app.collapsed .sidefoot{width:100%}
  .app.collapsed .sidefoot .iconbtn{padding:0}
  .app.collapsed nav{width:100%;display:flex;flex-direction:column;gap:6px}
}
@media (max-width:700px){
  .tscroll:not(.keep) table{min-width:0}
  .tscroll:not(.keep) td,.tscroll:not(.keep) th{min-width:0}
  .tscroll:not(.keep) td .cv{overflow-wrap:break-word;word-break:keep-all}
}

.upd .dtm{color:var(--mute);font-weight:500;font-size:12.5px}
.ui .fx{padding-left:16px;font-size:15px}
.ui .fx li{margin:3px 0}
.sk.linked{box-shadow:0 0 0 2px var(--manabg),var(--shadow)}
.gh{margin:20px 0 9px;font-size:15.5px;font-weight:800}
.gh:first-child{margin-top:4px}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:11px}
.pet{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--mana);box-shadow:var(--shadow);border-radius:var(--radius-sm);padding:13px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;word-break:keep-all;overflow-wrap:break-word}
.pet .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;row-gap:4px}
.pet .nm{flex:1 1 130px;min-width:0;font-weight:800;font-size:16px}
.pet .gr{font-size:12.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.pet .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pet .stats div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 3px;text-align:center;font-size:12px;color:var(--mute);line-height:1.3}
.pet .stats b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.pet dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:14px;line-height:1.5}
.pet dt{color:var(--mute);font-size:13px}
.pet dd{margin:0;min-width:0;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="목차">
    <div class="sidehead"><div class="brand"><span>🐾</span><span class="lb">해정펫 정리</span></div><button type="button" class="iconbtn" id="collapseBtn" aria-expanded="true" title="목차 접기">◀</button></div>
    <div class="brandsub">규칙 · 확률 · 스킬 모음</div>
    <nav id="sideNav" role="tablist" aria-label="해정펫 정리 목차"></nav>
    <div class="sidefoot"><button type="button" class="iconbtn themebtn"></button></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button type="button" class="iconbtn" id="menuBtn" aria-expanded="false" aria-controls="drawer">☰ 목차</button>
      <div class="ttl" id="ttl"></div>
      <button type="button" class="iconbtn themebtn"></button>
    </header>
    <div class="wrap">
      <h1>🐾 해정펫 정리</h1>
      <p class="sub">게임 규칙 · 확률 · 스킬을 한곳에 모았어요.</p>
      <main id="panels"></main>
      <p class="foot" id="foot"></p>
    </div>
  </div>
</div>
<div class="drawer" id="drawer" hidden>
  <div class="sheet" role="dialog" aria-label="전체 목차">
    <div class="hd"><b>📂 전체 목차</b><button type="button" class="iconbtn" id="closeBtn">닫기 ✕</button></div>
    <div class="dgrid" id="drawerGrid"></div>
  </div>

const TABS = [['update', '🆕 업데이트', panelUpdates], ['start', '🐣 한눈에 보기', panelStart], ['prob', '🎲 확률 정리', panelProb], ['catch', '🌿 탐험·포획', panelCatch], ['battle', '⚔️ 전투·보상', panelBattle], ['world', '🗺️ 장소·펫', panelWorld], ['elem', '🌈 속성', panelElem], ['odds', '✨ 스킬 확률', panelOdds], ['skills', '📚 스킬 도감', panelSkills], ['items', '🎒 아이템·육성', panelItems], ['equip', '🛡️ 장비', panelEquip], ['rank', '🏆 전투력·랭킹', panelRank]];
const panels = {};
const drawer = $('drawer');
const setDrawer = (open) => { drawer.hidden = !open; $('menuBtn').setAttribute('aria-expanded', String(open)); document.body.style.overflow = open ? 'hidden' : ''; };
TABS.forEach(([id, label, fn]) => {
  [$('sideNav'), $('drawerGrid')].forEach((host) => { const b = el('button', 'navbtn'); const [ic, ...rest] = label.split(' '); b.append(el('span', 'ic', ic), el('span', 'lb', rest.join(' '))); b.title = label; b.type = 'button'; b.dataset.tab = id; b.setAttribute('role', 'tab'); b.addEventListener('click', () => show(id)); host.append(b); });
  const pn = fn(); pn.hidden = true; pn.setAttribute('role', 'tabpanel'); $('panels').append(pn); panels[id] = pn;
});
function show(id, scroll = true) {
  if (!panels[id]) id = 'update';
  TABS.forEach(([k, label]) => { panels[k].hidden = k !== id; if (k === id) $('ttl').textContent = label; });
  document.querySelectorAll('.navbtn').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* 파일로 열어도 괜찮아요 */ }
  setDrawer(false);
  if (scroll) window.scrollTo({ top: 0 });
}
$('menuBtn').addEventListener('click', () => setDrawer(true));
$('closeBtn').addEventListener('click', () => setDrawer(false));
drawer.addEventListener('click', (e) => { if (e.target === drawer) setDrawer(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setDrawer(false); });

// 왼쪽 목차 접기/펼치기
const appEl = document.querySelector('.app');
function setCollapsed(c) {
  appEl.classList.toggle('collapsed', c);
  const b = $('collapseBtn'); b.textContent = c ? '▶' : '◀'; b.title = c ? '목차 펼치기' : '목차 접기'; b.setAttribute('aria-expanded', String(!c));
  try { localStorage.setItem('hj-side', c ? '1' : '0'); } catch (e) { /* 무시 */ }
}
$('collapseBtn').addEventListener('click', () => setCollapsed(!appEl.classList.contains('collapsed')));
let startCollapsed = false;
try { startCollapsed = localStorage.getItem('hj-side') === '1'; } catch (e) { /* 무시 */ }
setCollapsed(startCollapsed);

// 다크모드: 자동 → 라이트 → 다크
const THEMES = [['auto', '🌓 자동'], ['light', '☀️ 라이트'], ['dark', '🌙 다크']];
let themeIdx = 0;
try { const s = localStorage.getItem('hj-theme'); const i = THEMES.findIndex((t) => t[0] === s); if (i >= 0) themeIdx = i; } catch (e) { /* 저장 안 돼도 괜찮아요 */ }
function applyTheme() {
  const [mode, label] = THEMES[themeIdx];
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode);
  document.querySelectorAll('.themebtn').forEach((b) => { b.replaceChildren(el('span', '', label.split(' ')[0]), el('span', 'lb', label.split(' ')[1])); b.title = '화면 모드 바꾸기 · ' + label; });
}
document.querySelectorAll('.themebtn').forEach((b) => b.addEventListener('click', () => { themeIdx = (themeIdx + 1) % THEMES.length; applyTheme(); try { localStorage.setItem('hj-theme', THEMES[themeIdx][0]); } catch (e) { /* 무시 */ } }));
applyTheme();

show((location.hash || '').slice(1) || 'update', false);
window.addEventListener('hashchange', () => show((location.hash || '').slice(1) || 'update'));
$('foot').textContent = `이 페이지의 숫자는 게임 코드의 기본값이에요. 관리자 설정으로 값을 바꿨다면 실제 게임과 다를 수 있어요. (데이터 기준일 ${D.builtAt} · 설명서 최근 업데이트 2026-11-01)`;
</script>
