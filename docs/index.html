<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>해정펫 관리자</title>
<script>
// 다크모드: 저장된 선택 → 없으면 기기 설정을 따라가요 (깜빡임 방지로 맨 위에서 실행)
document.documentElement.dataset.theme = localStorage.hj_theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<style>
:root{--bg:#f4f5fa;--card:#fff;--ink:#1c2230;--sub:#667085;--line:#dfe3ee;--pri:#4f46e5;--on:#fff;--bad:#d92d20;--ok:#12805c;--chg:#fff3c4;--field:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#0e1220;--card:#171c2d;--ink:#e7eaf6;--sub:#98a2bf;--line:#283050;--pri:#8e96ff;--on:#0e1220;--bad:#ff7b72;--ok:#4cd6a0;--chg:#40371c;--field:#0f1424;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:38px;width:100%}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;min-height:38px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button.del{color:var(--bad)}
.err{border-color:var(--bad)!important}
.hide{display:none!important}
/* 로그인 */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(380px,100%);display:grid;gap:12px}
#login h1{margin:0 0 4px;font-size:20px}
label.f{display:grid;gap:4px;color:var(--sub);font-size:13px}
/* 상단 */
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 auto 0 0}
#state{color:var(--sub);font-size:13px}
nav{display:flex;gap:4px;padding:8px 16px 0;overflow-x:auto;position:sticky;top:59px;z-index:4;background:var(--bg)}
nav button{border-radius:8px 8px 0 0;border-bottom:0;white-space:nowrap}
nav button[aria-selected=true]{background:var(--pri);color:var(--on);border-color:var(--pri)}
main{padding:16px;max-width:1100px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px}
.hint{color:var(--sub);font-size:13px;margin:0 0 8px}
details.attrs{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
details.attrs>summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:13.5px}
details.attrs dl{margin:0;padding:0 12px 10px;display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;font-size:13px}
details.attrs dt{font-weight:600}
details.attrs dt code{color:var(--pri)}
details.attrs dd{margin:0;color:var(--ink);opacity:.9}
details.attrs dd small{display:block;color:var(--sub)}
@media(max-width:560px){details.attrs dl{grid-template-columns:1fr}details.attrs dd{margin-bottom:4px}}
.row{display:grid;grid-template-columns:1fr 150px 38px;gap:8px;align-items:center;padding:6px 8px;border-radius:8px}
.row.chg,td.chg{background:var(--chg)}
.row code,.hint code{color:var(--sub);font-size:12px}
.easy{color:var(--ink);opacity:.85;font-size:13.5px;margin:2px 0 3px;max-width:62ch}
.unit{display:block;color:var(--sub);font-size:12px;margin-top:3px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools>*{flex:1;min-width:140px}.tools>button{flex:0 0 auto}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--sub);font-weight:600;font-size:12px}
td input,td select{min-width:64px}td input[type=text]{min-width:110px}
.empty{color:var(--sub);text-align:center;padding:24px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:10px 14px;max-width:min(520px,94vw);box-shadow:0 6px 24px #0004;z-index:20}
#toast.bad{border-left-color:var(--bad)}
#toast ul{margin:4px 0 0;padding-left:18px}
textarea{min-height:180px;font:12px/1.5 ui-monospace,Consolas,monospace}
@media(max-width:560px){.row{grid-template-columns:1fr 110px 38px}nav{top:104px}}
@media(prefers-reduced-motion:no-preference){button{transition:border-color .15s}}
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>🐾 해정펫 관리자</h1>
    <label class="f">봇 서버 주소 (Vercel)
      <input id="apiUrl" type="url" placeholder="https://내-봇.vercel.app" required autocomplete="url"></label>
    <label class="f">비밀번호
      <input id="pw" type="password" required autocomplete="current-password"></label>
    <button class="pri" id="loginBtn">열기</button>
    <small id="loginMsg" style="color:var(--bad)" role="alert"></small>
  </form>
</div>

<div id="app" class="hide">
  <header>
    <h1>🐾 해정펫 관리자</h1>
    <span id="state"></span>
    <button id="themeBtn" title="다크모드 전환" aria-label="다크모드 전환">🌙</button>
    <button id="revertBtn">되돌리기</button>
    <button id="saveBtn" class="pri">저장</button>
    <button id="outBtn">로그아웃</button>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div id="toast" class="hide" role="status"></div>

<script>
'use strict';
// 👇 봇 서버 주소를 미리 적어두면 로그인 화면에 자동으로 채워져요 (예: 'https://내-봇.vercel.app')
const DEFAULT_API = '';

const $ = (q) => document.querySelector(q);
const J = JSON.stringify;
const clone = (v) => JSON.parse(J(v));
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

// ───────── 상태 ─────────
let api = '', D, META, cur, saved = '', tab = '설정';
const KINDS = ['pets', 'items', 'locations'];
const token = () => sessionStorage.hj_token;

function merge(ov) {
  const m = clone(D);
  Object.assign(m.scalars, ov.scalars);
  for (const k in ov.tables) if (k in m.tables) m.tables[k] = clone(ov.tables[k]);
  for (const kind of KINDS) for (const id in ov[kind] ?? {}) m[kind][id] = { ...clone(ov[kind][id]), id };
  return m;
}
function overrides() {
  const o = { scalars: {}, tables: {}, pets: {}, items: {}, locations: {} };
  for (const k in cur.scalars) if (cur.scalars[k] !== D.scalars[k]) o.scalars[k] = cur.scalars[k];
  for (const k in cur.tables) if (J(cur.tables[k]) !== J(D.tables[k])) o.tables[k] = cur.tables[k];
  for (const kind of KINDS) for (const id in cur[kind]) if (J(cur[kind][id]) !== J(D[kind][id])) o[kind][id] = cur[kind][id];
  return o;
}
const countOv = (o) => Object.values(o).reduce((n, g) => n + Object.keys(g).length, 0);

// ───────── 통신 ─────────
async function call(method, body, path = '?action=config') {
  const r = await fetch(`${api}/api/admin${path}`, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token() ? { Authorization: `Bearer ${token()}` } : {}) },
    body: body ? J(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && token()) logout('로그인이 만료됐어요. 다시 열어주세요');
  return { ok: r.ok, status: r.status, data };
}

async function userCall(method, path, body) {
  const r = await fetch(`${api}/api/users${path}`, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token() ? { Authorization: `Bearer ${token()}` } : {}) },
    body: body ? J(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && token()) logout('로그인이 만료됐어요. 다시 열어주세요');
  return { ok: r.ok, status: r.status, data };
}

// ───────── 알림 ─────────
let toastTimer;
function toast(msg, bad = false, list = []) {
  const t = $('#toast');
  t.className = bad ? 'bad' : '';
  t.replaceChildren(h('b', {}, msg), list.length ? h('ul', {}, list.map((x) => h('li', {}, x))) : null);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hide'), bad ? 9000 : 3500);
}

// ───────── 입력 도우미 (바꾸면 바로 cur 에 반영) ─────────
let barTimer;
const touch = () => { clearTimeout(barTimer); barTimer = setTimeout(updateBar, 100); };

function numInput(obj, key, { step = 'any', onchange } = {}) {
  const i = h('input', { type: 'number', step, value: obj[key], 'aria-label': key });
  i.addEventListener('input', () => {
    const ok = i.value !== '' && Number.isFinite(Number(i.value));
    i.classList.toggle('err', !ok);
    if (ok) { obj[key] = Number(i.value); onchange?.(); touch(); }
  });
  return i;
}
function textInput(obj, key, { nullable = false } = {}) {
  const i = h('input', { type: 'text', value: obj[key] ?? '', 'aria-label': key });
  i.addEventListener('input', () => { obj[key] = nullable && i.value === '' ? null : i.value; touch(); });
  return i;
}
function checkInput(obj, key, onchange) {
  const i = h('input', { type: 'checkbox', checked: !!obj[key], 'aria-label': key });
  i.addEventListener('change', () => { obj[key] = i.checked; onchange?.(); touch(); });
  return i;
}
function selectInput(obj, key, options, onchange) {
  const s = h('select', { 'aria-label': key }, options.map(([v, label]) => h('option', { value: v, selected: v === obj[key] }, label)));
  s.addEventListener('change', () => { obj[key] = s.value; onchange?.(); touch(); });
  return s;
}
const gradeOpts = () => Object.entries(cur.tables.GRADES).sort((a, b) => a[1].order - b[1].order).map(([k, g]) => [k, `${g.emoji} ${g.name}`]);
const gradeLabel = (k) => (cur.tables.GRADES[k] ? `${cur.tables.GRADES[k].emoji} ${cur.tables.GRADES[k].name}` : k);
function askId(kind) {
  const id = (prompt('새 항목의 id (영어 소문자·숫자·_ , 2~40자)') ?? '').trim();
  if (!id) return null;
  if (!/^[a-z0-9_]{2,40}$/.test(id)) return void toast('id 는 영어 소문자·숫자·_ 2~40자만 가능해요', true);
  if (cur[kind][id]) return void toast('이미 있는 id 예요', true);
  return id;
}

// ───────── 쉬운 설명 (이름 · 설명 · 단위) ─────────
// 단위: pct = 0.1 → 10% 로 보여줘요 / ms = 밀리초 → 분·시간 / sec = 초 → 분 / 없으면 그냥 숫자
const G = { base: '🎮 시작 · 기본', catch: '🔴 펫 잡기', fight: '⚔️ 싸우기', win: '💰 이겼을 때 보상', easy: '🧰 편의 기능', boost: '🚀 부스트 · 시간 단축', wait: '⏳ 탐험 기다리기', grow: '🌱 키우기', hp: '❤️ 체력 회복', att: '📅 출석 · 도감 보상', duel: '🥊 유저 대결', trade: '🤝 펫 거래', item: '🍖 잡기 아이템' };
const HELP = {
  MAX_LEVEL: [G.base, '최고 레벨', '트레이너와 펫이 올라갈 수 있는 맨 꼭대기 레벨이에요. 100이면 100레벨에서 멈춰요.'],
  START_GOLD: [G.base, '처음 받는 골드', '모험을 처음 시작할 때 지갑에 들어 있는 돈이에요. 1000이면 1000골드를 받아요.'],
  START_BALLS: [G.base, '처음 받는 해정볼 개수', '펫을 잡을 때 던지는 공이에요. 시작할 때 몇 개를 줄지 정해요.'],
  CATCH_DROP_PER_TRY: [G.catch, '공을 던질 때마다 줄어드는 잡을 확률', '같은 펫에게 공을 던질 때마다 잡힐 확률이 이만큼씩 내려가요. 0.1이면 10%씩 줄어요. 자꾸 던질수록 점점 어려워져요.', 'pct'],
  FLEE_BASE: [G.catch, '처음 실패했을 때 도망갈 확률', '공이 빠져나오면 펫이 도망갈 수도 있어요. 첫 번째 실패에서 도망갈 가능성이에요. 0.25면 4번 중 1번꼴이에요.', 'pct'],
  FLEE_RISE_PER_TRY: [G.catch, '실패할수록 늘어나는 도망 확률', '공이 빠져나올 때마다 도망갈 확률이 이만큼 더 커져요. 0.35면 35%씩 늘어요.', 'pct'],
  FLEE_MAX: [G.catch, '도망 확률의 맨 위 한계', '도망 확률이 아무리 커져도 이 숫자는 못 넘어요. 0.9면 아무리 실패해도 최대 90%예요.', 'pct'],
  BATTLE_MAX_ROUNDS: [G.fight, '싸움 최대 턴 수', '이 턴 안에 승부가 안 나면 야생 펫이 도망가고 비겨요. 15면 서로 15번 공격하면 끝나요.'],
  CRIT_CHANCE: [G.fight, '급소 맞힐 확률', '공격이 급소에 딱 맞으면 1.5배로 아파요. 0.1이면 10번에 1번꼴이에요.', 'pct'],
  EVADE_CHANCE: [G.fight, '내 펫이 공격을 피할 확률', '야생 펫의 공격을 휙 피하면 데미지가 0이에요. 0.03이면 100번에 3번이에요.', 'pct'],
  WILD_FLEE_CHANCE: [G.fight, '야생 펫이 겁먹고 도망갈 확률', '턴이 끝날 때마다 야생 펫이 무서워서 혼자 도망갈 수 있어요. 0.01이면 100번에 1번이에요.', 'pct'],
  GOLD_PER_YIELD: [G.win, '이기면 받는 골드 배율', '이겼을 때 골드는 "야생 펫의 경험치 점수 × 이 숫자"예요. 클수록 골드를 많이 줘요.'],
  WIN_TRAINER_EXP_MULT: [G.win, '이기면 트레이너가 받는 경험치 배율', '클수록 트레이너가 빨리 레벨업해요. 1.5면 1.5배예요.'],
  WIN_PET_EXP_MULT: [G.win, '이기면 내 펫이 받는 경험치 배율', '클수록 펫이 빨리 커요. 트레이너 배율보다 크게 해두면 펫이 더 빨리 커요.'],
  BONUS_TRIPLE_CHANCE: [G.win, '대박! 3배 보상 확률', '이겼을 때 아주 가끔 경험치와 골드를 3배로 줘요. 0.001이면 0.1%, 1000번에 1번이에요.', 'pct'],
  BONUS_DOUBLE_CHANCE: [G.win, '2배 보상 확률', '이겼을 때 가끔 2배로 줘요. 0.005면 0.5%예요. 3배와 한꺼번에 나오지는 않아요.', 'pct'],
  HEAL_FULL_CAP: [G.easy, '[회복 가득]에 쓸 약 최대 개수', '한 번에 약을 너무 많이 쓰지 않게 막는 안전장치예요.'],
  MULTI_TURNS: [G.easy, '[공격 ×3] 한 번에 싸우는 턴 수', '버튼 한 번에 몇 번 공격할지예요. 3이면 3번 연속으로 공격해요.'],
  MULTI_THROWS: [G.easy, '[잡기 ×3] 한 번에 던지는 공 개수', '버튼 한 번에 공을 몇 개 던질지예요.'],
  MULTI_STOP_HP_RATIO: [G.easy, '연속 행동이 멈추는 체력', '연속으로 싸우다가 내 펫 체력이 이만큼 이하가 되면 위험해서 멈춰요. 0.3이면 체력이 30% 이하일 때예요.', 'pct'],
  MAX_BUY_AT_ONCE: [G.easy, '한 번에 살 수 있는 최대 개수', '상점에서 한꺼번에 너무 많이 사는 걸 막아요.'],
  MAX_TRAIN_AT_ONCE: [G.easy, '한 번에 할 수 있는 최대 훈련 횟수', '훈련을 한꺼번에 몇 번까지 시킬 수 있는지예요.'],
  MAX_CUSTOM_COUNT: [G.easy, '[직접 입력]에 넣을 수 있는 최대 숫자', '싸우는 중에 개수를 직접 적을 때 넣을 수 있는 가장 큰 숫자예요.'],
  BOOST_PCT: [G.boost, '경험치 부스트 효과', '부스트 아이템을 켜면 경험치를 이만큼 더 줘요. 0.3이면 30% 더 많이 받아요.', 'pct'],
  SPEEDUP_PCT: [G.boost, '탐험 시간 단축 효과', '아이템 1개를 쓰면 남은 기다림이 이만큼 줄어요. 0.3이면 30% 짧아져요.', 'pct'],
  SPEEDUP_MIN_SEC: [G.boost, '단축해도 남는 최소 시간', '아무리 줄여도 기다리는 시간이 이 시간보다 짧아지지는 않아요.', 'sec'],
  SPEEDUP_BLOCK_SEC: [G.boost, '이 시간 이하면 단축 못 써요', '거의 다 기다렸는데 아이템을 쓰면 아깝죠. 남은 시간이 이 시간 이하면 못 쓰게 막아요.', 'sec'],
  LEVEL_WAIT_BONUS: [G.wait, '센 레벨일 때 더 기다리는 정도', '그 지역에서 가장 높은 레벨의 펫이 나올 차례면 기다림이 이만큼 길어져요. 0.4면 40% 더 길어요.', 'pct'],

const dur = (sec) => (sec >= 3600 ? `${+(sec / 3600).toFixed(2)}시간` : sec >= 60 ? `${+(sec / 60).toFixed(2)}분` : `${+sec.toFixed(2)}초`);
function fmt(k, v) {
  const u = HELP[k]?.[3];
  if (typeof v === 'boolean') return v ? '켜짐' : '꺼짐';
  if (u === 'pct') return `${+(v * 100).toFixed(2)}%`;
  if (u === 'ms') return dur(v / 1000);
  if (u === 'sec') return dur(v);
  return String(v);
}

function tabSettings() {
  const q = h('input', { type: 'search', placeholder: '찾기 (예: 도망, 골드, 거래)' });
  const box = h('div', { style: 'display:grid;gap:14px;margin-top:14px' });
  const info = (k) => HELP[k] ?? ['기타', k, META[k].desc];
  const rowFor = (k) => {
    const [, title, easy] = info(k), isBool = typeof D.scalars[k] === 'boolean';
    const row = h('div', { class: 'row' });
    const note = h('small', { class: 'unit' });
    const sync = () => { row.classList.toggle('chg', cur.scalars[k] !== D.scalars[k]); note.textContent = `${fmt(k, cur.scalars[k])} (기본 ${fmt(k, D.scalars[k])})`; };
    const input = isBool ? checkInput(cur.scalars, k, sync) : numInput(cur.scalars, k, { onchange: sync });
    const reset = h('button', { title: `기본값(${fmt(k, D.scalars[k])})으로 되돌리기`, 'aria-label': '기본값으로', onclick: () => { cur.scalars[k] = D.scalars[k]; draw(); touch(); } }, '↺');
    row.append(h('div', {}, h('b', {}, title), h('div', { class: 'easy' }, easy), h('code', {}, k)), h('div', {}, input, note), reset);
    sync();
    return row;
  };
  const draw = () => {
    const f = q.value.trim().toLowerCase(), groups = {};
    for (const k in cur.scalars) {
      const [g, t, e] = info(k);
      if (!f || `${k} ${g} ${t} ${e}`.toLowerCase().includes(f)) (groups[g] ??= []).push(k);
    }
    const order = Object.values(G);
    box.replaceChildren(...Object.entries(groups).sort((x, y) => order.indexOf(x[0]) - order.indexOf(y[0])).map(([s, ks]) => h('section', { class: 'card' }, h('h3', {}, s), ks.map(rowFor))));
    if (!box.children.length) box.append(h('p', { class: 'empty' }, '찾는 설정이 없어요'));
  };
  q.addEventListener('input', draw);
  draw();
  return h('div', {}, h('p', { class: 'hint' }, '숫자를 바꾸면 노란색으로 표시돼요. ↺ 를 누르면 처음 값으로 돌아가요. 퍼센트(%)로 쓰는 값은 0.1 = 10% 예요. 바꾼 뒤 위쪽 [저장]을 눌러야 적용돼요.'), q, box);
}

function tabTables() {
  const card = (name) => {
    const t = cur.tables[name];
    let rows;
    if (Array.isArray(t)) rows = t.map((r, i) => [`#${i + 1}`, r]);
    else if (Object.values(t).every((v) => v && typeof v === 'object')) rows = Object.entries(t).map(([k, r]) => [k, r]);
    else rows = [['값', t]];
    const cols = [...new Set(rows.flatMap(([, r]) => Object.keys(r)))];
    const cell = (r, c) => {
      const v = r[c];

    return h('section', { class: 'card' }, h('h3', {}, name), h('p', { class: 'hint' }, TABLE_INFO[name]),
      h('div', { class: 'wrap' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, ''), cols.map((c) => h('th', { title: c }, COLS[c] ?? c)))),
        h('tbody', {}, rows.map(([k, r]) => h('tr', {}, h('td', {}, cur.tables.GRADES[k] ? gradeLabel(k) : k), cols.map((c) => h('td', {}, c in r ? cell(r, c) : '')))))))
    );
  };
  return h('div', { style: 'display:grid;gap:14px' }, Object.keys(cur.tables).map(card));
}

// ───────── 탭: 유저 관리 ─────────
let U = null, Uadmin = true; // 불러온 유저 데이터, 관리자 모드(모든 항목 해금) 여부
function tabUsers() {
  const idInput = h('input', { placeholder: '디스코드 유저 ID', value: U?.userId ?? '' });
  const msg = h('small', { style: 'color:var(--sub)' });
  const box = h('div', { style: 'display:grid;gap:14px' });
  const field = (label, node) => h('label', { class: 'f' }, label, node);
  const bound = (make) => (obj, key) => { const i = make(obj, key); i.disabled = !Uadmin; return i; };
  const txt = bound((obj, key) => { const i = h('input', { value: obj[key] ?? '' }); i.addEventListener('input', () => { obj[key] = i.value; }); return i; });
  const num = bound((obj, key) => { const i = h('input', { type: 'number', value: obj[key] ?? 0 }); i.addEventListener('input', () => { obj[key] = Number(i.value); }); return i; });
  const chk = bound((obj, key) => { const i = h('input', { type: 'checkbox', checked: !!obj[key] }); i.addEventListener('change', () => { obj[key] = i.checked; }); return i; });

  function drawLoaded() {
    const jsonArea = h('textarea', { 'aria-label': '펫·인벤토리·도감 (JSON)', disabled: !Uadmin });
    jsonArea.value = J({ inventory: U.data.inventory, pets: U.data.pets, mainPetUid: U.data.mainPetUid, dex: U.data.dex, exploration: U.data.exploration }, null, 2);
    const applyJson = () => { try { Object.assign(U.data, JSON.parse(jsonArea.value)); toast('반영했어요 (저장을 눌러야 적용돼요)'); } catch { toast('JSON 을 읽을 수 없어요', true); } };
    box.replaceChildren(
      h('section', { class: 'card' },
        h('h3', {}, `👤 ${U.data.name ?? U.userId}`, !Uadmin ? h('code', { style: 'margin-left:8px' }, '유저 모드(읽기 전용)') : null),
        h('div', { class: 'tools' }, field('이름', txt(U.data, 'name')), field('레벨', num(U.data, 'level')), field('경험치', num(U.data, 'exp')), field('골드', num(U.data, 'gold'))),
        field('자동사냥', chk(U.data, 'autoHunt'))),
      h('section', { class: 'card' },
        h('h3', {}, '펫 · 인벤토리 · 도감 (JSON)'),
        h('p', { class: 'hint' }, '구조가 복잡해서 JSON으로 직접 편집해요. [위 내용 반영]을 누른 뒤 저장해주세요.'),
        jsonArea,
        h('div', { class: 'tools', style: 'margin-top:8px' }, h('button', { disabled: !Uadmin, onclick: applyJson }, '위 내용 반영'))),
      h('div', { class: 'tools' },
        h('button', { class: 'pri', disabled: !Uadmin, onclick: saveUser }, '저장'),
        h('button', { disabled: !U.hasBackup, onclick: revertUser }, '이전 저장으로 되돌리기')));
  }

  async function loadUser() {
    const id = idInput.value.trim();
    if (!id) return;
    msg.textContent = '불러오는 중...';
    const r = await userCall('GET', `?action=user&id=${encodeURIComponent(id)}`);
    if (!r.ok) { msg.textContent = r.data.error ?? '불러오지 못했어요'; U = null; box.replaceChildren(); return; }
    U = r.data; msg.textContent = '';
    drawLoaded();
  }
  async function saveUser() {
    const r = await userCall('PUT', `?action=user&id=${encodeURIComponent(U.userId)}`, { data: U.data });
    if (r.ok) { U.hasBackup = true; toast('저장했어요 ✔'); drawLoaded(); }
    else toast(r.data.error ?? '저장하지 못했어요', true);
  }
  async function revertUser() {
    if (!confirm('이전 저장으로 되돌릴까요? (한 단계만 보관돼요)')) return;
    const r = await userCall('POST', `?action=revert&id=${encodeURIComponent(U.userId)}`);
    if (r.ok) { U.data = r.data.data; U.hasBackup = false; toast('되돌렸어요 ✔'); drawLoaded(); }
    else toast(r.data.error ?? '되돌리지 못했어요', true);
  }

  const adminToggle = h('label', { class: 'f', style: 'display:flex;flex-direction:row;align-items:center;gap:8px' },
    h('input', { type: 'checkbox', checked: Uadmin, onchange: (e) => { Uadmin = e.target.checked; if (U) drawLoaded(); } }),
    '관리자 모드 (모든 항목 편집 해금) — 끄면 유저처럼 읽기 전용으로 봐요');

  if (U) drawLoaded();
  return h('div', { style: 'display:grid;gap:14px' },
    h('section', { class: 'card' }, h('h3', {}, '유저 불러오기'),
      h('div', { class: 'tools' }, idInput, h('button', { class: 'pri', onclick: loadUser }, '불러오기'), msg),
      adminToggle),
    box);
}

// ───────── 화면 ─────────
const TABS = { 설정: tabSettings, 펫: tabPets, 아이템: tabItems, 지역: tabLocations, '등급·표': tabTables, '유저 관리': tabUsers, 도구: tabTools };
function show() {
  $('#tabs').replaceChildren(...Object.keys(TABS).map((n) => h('button', { role: 'tab', 'aria-selected': n === tab, onclick: () => { tab = n; show(); } }, n)));
  $('#view').replaceChildren(TABS[tab]());
  // 상단 저장/되돌리기는 "설정·펫·아이템·지역·등급·표" 전용이에요. 유저 관리 탭은 유저별로 따로 저장/되돌리기 버튼이 있어서
  // (기본값과 다른 항목이 없으면 계속 비활성 상태로 보여서 눌리지 않는 것처럼 보였어요) 이 탭에서는 숨겨요.
  $('#saveBtn').classList.toggle('hide', tab === '유저 관리');
  $('#revertBtn').classList.toggle('hide', tab === '유저 관리');
  updateBar();
}
function updateBar() {
  const o = overrides(), dirty = J(o) !== saved;
  $('#saveBtn').disabled = !dirty;
  $('#revertBtn').disabled = !dirty;
  $('#state').textContent = `${dirty ? '● 저장 안 된 변경 있음 · ' : ''}기본값과 다른 항목 ${countOv(o)}개`;
}

async function save() {
  const o = overrides();
  $('#saveBtn').disabled = true;
  const r = await call('PUT', { overrides: o });
  if (r.ok) { saved = J(o); toast('저장했어요 ✔ 봇에는 20초 안에 반영돼요'); }
  else toast(r.data.error ?? '저장하지 못했어요', true, r.data.errors ?? []);
  updateBar();
}

async function load() {
  const r = await call('GET');
  if (!r.ok) return toast(r.data.error ?? '불러오지 못했어요', true);
  D = r.data.defaults; META = r.data.meta.scalars;
  cur = merge(r.data.overrides ?? {});
  saved = J(overrides());
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  show();
}
function logout(msg = '') {
  sessionStorage.removeItem('hj_token');
  $('#app').classList.add('hide'); $('#login').classList.remove('hide');
  $('#loginMsg').textContent = msg; $('#pw').value = '';
}

// ───────── 시작 ─────────
const normalize = (u) => u.trim().replace(/\/+$/, '').replace(/\/api\/admin$/, '');
$('#apiUrl').value = localStorage.hj_api || DEFAULT_API;
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  api = normalize($('#apiUrl').value);
  $('#loginBtn').disabled = true; $('#loginMsg').textContent = '';
  try {
    const r = await call('POST', { password: $('#pw').value }, '?action=login');
    if (!r.ok) $('#loginMsg').textContent = r.data.error ?? `오류 (${r.status})`;
    else { sessionStorage.hj_token = r.data.token; localStorage.hj_api = api; await load(); }
  } catch { $('#loginMsg').textContent = '서버에 연결할 수 없어요. 주소를 확인해주세요'; }
  $('#loginBtn').disabled = false; $('#pw').value = '';
});
$('#saveBtn').onclick = save;
$('#revertBtn').onclick = () => { if (confirm('저장하지 않은 변경을 모두 버릴까요?')) { cur = merge(JSON.parse(saved)); show(); } };
$('#outBtn').onclick = () => logout();
$('#themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = localStorage.hj_theme = next;
};
addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 's' && D) { e.preventDefault(); if (!$('#saveBtn').disabled) save(); } });
addEventListener('beforeunload', (e) => { if (D && J(overrides()) !== saved) e.preventDefault(); });
if (token() && localStorage.hj_api) { api = localStorage.hj_api; load().catch(() => logout()); } // 새로고침해도 로그인 유지(탭을 닫으면 해제)
</script>
</body>
</html>
